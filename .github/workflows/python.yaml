name: python CI
on: [push]
jobs:
   tests:
      runs-on: ubuntu-latets
      steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: setup python
          uses: actions/setup-python@v5
          with:
            python-version: "3.12"  

        - name: Install pytest
          run: pip install pytest

        - name: Run tests
          run: pytest    
